# All PHP commands run in containers, never on the host. See AGENTS.md.
#
#   docker compose run --rm php84 composer update
#   docker compose run --rm php84 composer test
#
# To add a PHP version: add a service below and an empty
# .docker/vendor/<service>/.gitkeep (so the directory belongs to the host user).

x-php-build: &php-build
    context: .
    dockerfile: .docker/php.Dockerfile

x-php: &php
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    working_dir: /app

services:
    php72:
        <<: *php
        build:
            <<: *php-build
            args:
                PHP_VERSION: "7.2"
        volumes:
            - ./:/app
            - ./.docker/vendor/php72:/app/vendor

    php73:
        <<: *php
        build:
            <<: *php-build
            args:
                PHP_VERSION: "7.3"
        volumes:
            - ./:/app
            - ./.docker/vendor/php73:/app/vendor

    php74:
        <<: *php
        build:
            <<: *php-build
            args:
                PHP_VERSION: "7.4"
        volumes:
            - ./:/app
            - ./.docker/vendor/php74:/app/vendor

    php80:
        <<: *php
        build:
            <<: *php-build
            args:
                PHP_VERSION: "8.0"
        volumes:
            - ./:/app
            - ./.docker/vendor/php80:/app/vendor

    php81:
        <<: *php
        build:
            <<: *php-build
            args:
                PHP_VERSION: "8.1"
        volumes:
            - ./:/app
            - ./.docker/vendor/php81:/app/vendor

    php82:
        <<: *php
        build:
            <<: *php-build
            args:
                PHP_VERSION: "8.2"
        volumes:
            - ./:/app
            - ./.docker/vendor/php82:/app/vendor

    php83:
        <<: *php
        build:
            <<: *php-build
            args:
                PHP_VERSION: "8.3"
        volumes:
            - ./:/app
            - ./.docker/vendor/php83:/app/vendor

    php84:
        <<: *php
        build:
            <<: *php-build
            args:
                PHP_VERSION: "8.4"
        volumes:
            - ./:/app
            - ./.docker/vendor/php84:/app/vendor

    php85:
        <<: *php
        build:
            <<: *php-build
            args:
                PHP_VERSION: "8.5"
        volumes:
            - ./:/app
            - ./.docker/vendor/php85:/app/vendor
